<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemia Smart Project</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --apple-blur: blur(20px); --apple-bg: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: radial-gradient(circle at top, #1a1a2e, #000); color: white; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
        
        /* تصميم الهيدر العصري */
        .header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; }
        .header h1 { font-size: 2rem; font-weight: 700; margin: 0; letter-spacing: -1px; }
        .header p { color: #888; font-size: 0.9rem; margin-top: 5px; }

        /* البطاقة الزجاجية (Apple Style Card) */
        .glass-panel {
            position: absolute; bottom: 40px; left: 20px; right: 20px;
            background: var(--apple-bg); backdrop-filter: var(--apple-blur);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 25px; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .mentor-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 0.75rem; text-align: center; }
        .mentor-item { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }

        model-viewer { width: 100%; height: 100vh; --poster-color: transparent; }
        
        .badge { background: #00d4ff; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">ثانوية الذرى الذكية للمتميزين</div>
        <h1>Artemia Salina 3D</h1>
        <p>محاكاة البيئة الذكية - كربلاء 2026</p>
    </div>

    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        camera-controls auto-rotate rotation-per-second="30deg"
        shadow-intensity="2" exposure="1" interaction-prompt="none">
    </model-viewer>

    <div class="glass-panel">
        <div style="font-size: 0.8rem; color: #888;">المبرمج الموهوب:</div>
        <div style="font-size: 1.4rem; font-weight: 600; margin-bottom: 5px;">محمد علي براء صاحب</div>
        
        <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>
        
        <div style="font-size: 0.8rem; color: #888;">بإشراف الأساتذة الأفاضل:</div>
        <div class="mentor-grid">
            <div class="mentor-item">خالد النصراوي</div>
            <div class="mentor-item">حامد النصراوي</div>
            <div class="mentor-item">علي غصن</div>
        </div>
    </div>

</body>
</html>
